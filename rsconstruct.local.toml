# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md renders from tera.templates/README.md.tera, loading config/*.lua
# with load_lua (the pyanyzip pattern). The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]

# The Makefile ran php_lint.py (php -l syntax check) on each src/**/*.php.
# rsconstruct has a php_lint processor that does exactly that; point it at src.
[processor.php_lint]
src_dirs = ["src"]

# The php_lint processor needs the php CLI.
[dependencies]
system = [
    "php-cli",
]
