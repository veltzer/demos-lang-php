# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# The Makefile ran php_lint.py (php -l syntax check) on each src/**/*.php.
# rsconstruct has a php_lint processor that does exactly that; point it at src.
[processor.php_lint]
src_dirs = ["src"]

# The php_lint processor needs the php CLI.
[dependencies]
system = [
    "php-cli",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
